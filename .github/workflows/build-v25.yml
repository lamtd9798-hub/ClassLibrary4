name: Build ClassLibrary4 V25

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ClassLibrary4/ClassLibrary4.csproj

      - name: Inspect design markers in source and legacy V25 binary
        shell: pwsh
        run: |
          $markers = @('THIẾT KẾ PCCC','THIẾT KẾ ACMV','THIẾT KẾ CTN','THIẾT KẾ ĐIỆN')
          $xaml = Get-Content 'ClassLibrary4/BOCTACHUI.xaml' -Raw -Encoding UTF8
          $legacyBytes = [System.IO.File]::ReadAllBytes('ClassLibrary4/ClassLibrary4.V25.dll')
          $legacyUtf8 = [System.Text.Encoding]::UTF8.GetString($legacyBytes)
          $legacyUnicode = [System.Text.Encoding]::Unicode.GetString($legacyBytes)
          foreach ($marker in $markers) {
            $src = $xaml.Contains($marker)
            $bin = $legacyUtf8.Contains($marker) -or $legacyUnicode.Contains($marker)
            Write-Host ("MARKER {0} | SOURCE={1} | LEGACY_DLL={2}" -f $marker, $src, $bin)
          }

      - name: Build Release x64
        run: dotnet build ClassLibrary4/ClassLibrary4.csproj -c Release -p:Platform=x64 --no-restore

      - name: Collect clean NETLOAD package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path ClassLibrary4/bin -Filter ClassLibrary4.dll -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $dll) { throw 'ClassLibrary4.dll was not produced.' }

          $outDir = $dll.Directory.FullName
          $pkg = 'artifact/ClassLibrary4_V25_CLEAN'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item (Join-Path $outDir '*') $pkg -Recurse -Force

          Copy-Item $dll.FullName (Join-Path $pkg 'ClassLibrary4.V25.dll') -Force
          Remove-Item (Join-Path $pkg 'ClassLibrary4.dll') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $pkg 'ClassLibrary4.pdb') -Force -ErrorAction SilentlyContinue

          Remove-Item (Join-Path $pkg 'ClassLibrary4.V25.DesignBridge.dll') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $pkg 'ClassLibrary4.V25.DesignHost.dll') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $pkg 'ClassLibrary4.V25.FireDesignModule.dll') -Force -ErrorAction SilentlyContinue

          Get-ChildItem $pkg -Recurse | Select-Object FullName, Length

      - name: Upload clean V25 package
        uses: actions/upload-artifact@v4
        with:
          name: ClassLibrary4.V25.CLEAN
          path: artifact/ClassLibrary4_V25_CLEAN
          if-no-files-found: error
